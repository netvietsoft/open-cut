requirements:
  - "1. Khảo sát 10 bộ source decompile (YouCut, VlogU, Instagram Basel, Kwai, GlitchCam, Lightroom, Facetune, Meitu, FaceApp, SnapEdit) và trích xuất các tính năng nổi trội còn thiếu vào OpenCut."
  - "2. Bổ sung vào Video Editor: Freeze Frame (Đóng băng 3s), Reverse Video (Đảo ngược), Speed Curves (Montage, Bullet Time, Hero), Video Masking (Linear, Circle, Mirror, Invert), Shaders Glitch & VHS độc quyền (RGB Split, VHS 1998, Matrix, Trippy Wave, Beat Shake, Neon CRT), Voice Effects DSP (Chipmunk, Robot C++, Monster, Echo Studio)."
  - "3. Bổ sung vào Photo Editor: 7 chuyên mục tabs (Tỷ lệ, 3D LUTs, Lightroom Pro Tone Curves & Sliders Clarity/Dehaze/Grain/Vignette, Tẩy Xóa AI Inpaint & Đổi Bầu Trời Sunset/Aurora, Làm Đẹp VIP Facetune & Meitu Kéo Chân/Bling, Biến Hóa AI FaceApp Cười/Trẻ Hóa/Tóc, Tùy Chỉnh) cùng nút so sánh Trước/Sau (Before/After)."
  - "4. Bổ sung Shader strings và ColorMatrix/DSP algorithms trong EffectRegistry.java và MiddleBridgeJni.java."
  - "5. Thiết kế đầy đủ nút bấm, ngăn kéo trực quan, thân thiện, đồng bộ Dark Theme #12131A & Cyan/Gold trong MainActivity.java."
  - "6. Biên dịch đóng gói signed APK, deploy lên thiết bị kiểm thử emulator-5554, tự động test tất cả các chức năng và chụp ảnh bằng chứng nghiệm thu."
