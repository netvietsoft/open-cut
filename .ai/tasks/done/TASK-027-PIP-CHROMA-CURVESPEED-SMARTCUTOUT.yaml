requirements:
  - "1. Lớp Phủ Đa Tầng (PIP Multi-Track Overlay): Nút 'Lớp phủ' (toolOverlay) trong thanh công cụ chính cho phép chọn video/ảnh nạp vào dải PIP Track hiển thị song song bên dưới Main Track; Canvas Player hỗ trợ hiển thị PIP thu nhỏ ở góc hoặc đè lên video chính kèm chế độ hòa trộn (Normal, Screen, Multiply, Overlay)."
  - "2. Khóa Phông Nâng Cao (Advanced Chroma Key): Mở rộng ngăn kéo Khóa Phông với Ống hút màu tùy biến (Color Pipette) chọn màu bất kỳ từ màn hình + Thanh trượt Cường độ (Intensity 0-100) + Thanh trượt Bóng (Shadow 0-100) + Khử lem màu (Spill Reduction)."
  - "3. Tốc Độ Đường Cong Bezier (Custom Curve Speed 0.1x - 100x): Nâng cấp ngăn kéo Tốc độ với 2 tab 'Bình thường' (0.1x - 100x) và 'Uốn cong' (Curve) chứa 6 Presets CapCut (Tùy chỉnh, Montage, Bullet Time, Hero, Flash In, Jump Cut) kèm tương tác đồ thị Bezier."
  - "4. Tách Nền AI Thông Minh (Smart Cutout / AI Matting): Nhận diện chân dung người tự động tách phông trong 1 chạm + 4 kiểu Viền sáng nét (Neon Stroke, Dot Dash, Glow, Drop Shadow)."
  - "5. Lọc Ồn DSP & Tách Giọng Nói (Noise Reduction & Vocal Isolation): Nút 'Giảm ồn' trong menu Âm thanh kích hoạt bộ lọc âm DSP khử tạp âm nền + 'Tách giọng nói' (Tách Vocal / Tách Nhạc nền)."
  - "6. Chú thích song ngữ EN + VN cho 100% hàm, class và mã nguồn mới."
  - "7. Kiểm thử và xác thực thực tế 100% trên thiết bị vật lý Samsung Galaxy A50s (192.168.1.3:36903) và chụp ảnh minh chứng."
