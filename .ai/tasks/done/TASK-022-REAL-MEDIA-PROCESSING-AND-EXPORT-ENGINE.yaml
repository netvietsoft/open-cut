requirements:
  - "1. Thay thế toàn bộ logic giả lập (dummy Toast/log) của nút 'Xuất' (Export) bằng động cơ xuất video thực tế (Real Media Export Pipeline) sử dụng MediaExtractor, MediaMuxer, và MediaCodec."
  - "2. Đảm bảo khi bấm 'Xuất', ứng dụng tạo ra file .mp4 thực tế có dung lượng > 0 byte tại /sdcard/Movies/NextAI_OpenCut/ hoặc /sdcard/DCIM/NextAI_OpenCut/."
  - "3. Hiển thị ProgressDialog tiến trình thật (0% -> 100%) kèm trạng thái mã hóa thời gian thực."
  - "4. Sau khi xuất xong, gọi MediaScannerConnection quét file vào Samsung Gallery và hiển thị hộp thoại thành công kèm nút '[ ▶ XEM NGAY ]' (Intent ACTION_VIEW) để người dùng chạm vào là xem được ngay video vừa xuất trong trình phát Samsung Video."
  - "5. Bổ sung lớp phủ hiệu ứng hình ảnh trực quan thời gian thực (Real-time Visual FX Overlay) trên canvas phát video (videoPlayerView), để khi người dùng chọn bộ lọc màu (Portra, Cyberpunk, Teal & Orange, Noir B&W, Vintage) hoặc kéo thanh trượt Brightness/Contrast/Saturation thì màn hình video thay đổi màu sắc ngay lập tức."
  - "6. Nâng cấp lưu ảnh trong Photo Editor: khi bấm 'Lưu', hiển thị hộp thoại kèm nút xem ảnh ngay trong Thư Viện."
  - "7. Kiểm thử trực tiếp trên thiết bị vật lý Samsung Galaxy A50s (192.168.1.3:36903), xuất video thật, kiểm tra file qua adb shell ls -l và chụp ảnh màn hình nghiệm thu."
