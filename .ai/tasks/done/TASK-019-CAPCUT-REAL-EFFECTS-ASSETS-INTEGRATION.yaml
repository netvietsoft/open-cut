requirements:
  - "1. Rà soát và giải nén/sao chép các gói tài nguyên hiệu ứng gốc từ extracted/assets và apktool-res/res/raw vào app bundle: Chroma_V1370 (chromakey shaders), FaceReshape_V2 (distortion matrices), mattingBlend/koutu.json, spin/hexagon GLSL shaders, audio MP3, text animation textures."
  - "2. Cập nhật EffectRegistry.java ánh xạ đầy đủ danh mục hiệu ứng tài nguyên gốc CapCut kèm đường dẫn asset và metadata song ngữ."
  - "3. Nâng cấp build_apk.ps1 đóng gói thư mục assets/ và res/raw/ vào signed APK với forward-slash zip structure chuẩn Android."
  - "4. Cập nhật MainActivity.java hiển thị và áp dụng các hiệu ứng tài nguyên gốc CapCut này trong ngăn kéo Hiệu ứng, Khóa phông, Làm đẹp, Âm thanh và Văn bản."
  - "5. Biên dịch APK, cài đặt lên thiết bị Android, chạy kiểm thử thực tế và chụp ảnh minh chứng nghiệm thu (10 ảnh chụp màn hình kiểm thử)."
