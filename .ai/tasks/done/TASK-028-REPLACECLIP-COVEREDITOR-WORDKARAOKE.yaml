requirements:
  - "1. Đổi Clip Giữ Nguyên Thuộc Tính (Replace Clip): Nút 'Thay thế' trong menu con Chỉnh Sửa cho phép chọn tệp mới thay thế tệp hiện tại trên timeline nhưng bảo lưu 100% thời lượng cắt (trim points), keyframes, đường cong tốc độ, bộ lọc màu, âm lượng và hiệu ứng đã gán."
  - "2. Trình Sửa Ảnh Bìa (Cover Frame Editor): Chạm vào ô 'Ảnh bìa' trên timeline mở giao diện chọn khung hình đại diện (scrubber trích xuất frame từ video) hoặc nạp ảnh bìa từ máy; hỗ trợ chèn văn bản tiêu đề bìa, font chữ nghệ thuật và 4 template mẫu bìa CapCut (Minimalist, Bold Center, TikTok Banner, Cinematic)."
  - "3. Phụ Đề Nhảy Chữ Từng Từ (Word-By-Word Karaoke Highlight): Nâng cấp engine phụ đề tự động nhận diện và nhảy sáng từng từ (vàng rực rỡ / neon cyan pulse) theo nhịp phát âm thời gian thực của giọng đọc AI / âm thanh video."
  - "4. Tuân thủ Quy tắc 12 AGENTS.md: Chú thích song ngữ EN + VN cho 100% mã nguồn."
  - "5. Kiểm thử và xác thực thực tế 100% trên thiết bị vật lý Samsung Galaxy A50s (192.168.1.3:36903) và chụp ảnh minh chứng."
