acceptance_criteria:
  - Script test_acceptance_runner.ps1 chạy tự động qua ADB trên thiết bị thực 192.168.1.7:45893 và emulator.
  - Test case 1: Mở trình biên tập Video -> Thêm 2 clip -> Kiểm tra timeline có 2 clip.
  - Test case 2: Bấm Chỉnh sửa -> Bấm Tách (Split) -> Kiểm tra clip bị tách thành 2 phân đoạn (tổng 3 clip).
  - Test case 3: Bấm chọn clip 3 -> Bấm Xóa -> Kiểm tra clip 3 bị xóa khỏi timeline.
  - Test case 4: Bấm Tốc độ -> Chọn 2x -> Kiểm tra thời lượng hiển thị giảm 50%.
  - Test case 5: Bấm Tùy chỉnh (Adjust) -> Kéo SeekBar Độ sáng -> Kiểm tra giá trị thay đổi.
  - Test case 6: Mở Photo Editor -> Đổi tỷ lệ 1:1 -> Kiểm tra kích thước canvas thay đổi.
  - Test case 7: Chọn bộ lọc Portra 400 & Noir -> Kiểm tra bitmap đổi màu thực tế.
  - Test case 8: Kéo SeekBar Tương phản trong Photo Editor -> Kiểm tra bitmap cập nhật.
  - Chụp ảnh minh chứng tại TẤT CẢ các bước kiểm thử, ghi log vào .ai/reports/acceptance_report.json và .ai/reports/acceptance_report.md.
verification:
  test_type: automated_e2e_device
  runner: scripts/test_acceptance_runner.ps1
