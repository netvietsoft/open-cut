acceptance_criteria:
  - "[x] 1. Cấp quyền truy cập MediaStore (READ_MEDIA_IMAGES, READ_MEDIA_VIDEO, READ_EXTERNAL_STORAGE) với callback onRequestPermissionsResult tự động quét lại thư viện khi người dùng đồng ý."
  - "[x] 2. Quét MediaStore thực tế trên thiết bị (lên đến 100 tệp ảnh và video gần nhất), hiển thị thumbnail thật (ảnh thu nhỏ) của chính ảnh/video trên máy trong lưới chọn (Media Picker Grid) thay vì icon rỗng."
  - "[x] 3. Tích hợp Intent mở Bộ sưu tập hệ thống (System Gallery Picker) cho phép người dùng chọn bất kỳ ảnh hoặc video nào từ Google Photos / Samsung Gallery / File Manager với phân loại MIME rõ ràng."
  - "[x] 4. Khi người dùng chọn Ảnh từ bộ sưu tập và bấm Thêm -> Trình Chỉnh Sửa Ảnh (Photo Editor) giải mã Bitmap thật từ Uri bằng BitmapFactory/ImageDecoder, hiển thị ảnh gốc của người dùng trên Canvas thay vì vẽ vòng tròn mock."
  - "[x] 5. Toàn bộ các công cụ con/cháu trong Photo Editor (Tỷ lệ 3:4, 1:1, 4:5, 9:16, 16:9; Bộ lọc màu 3D LUT Portra, Cyberpunk, Teal Orange, Noir, Vintage; Thanh trượt Độ sáng, Tương phản, Độ bão hòa; Vẽ Face Mesh 468 điểm; Lưu ảnh về máy) áp dụng trực tiếp lên chính Bitmap thật của người dùng và xuất file thật vào thư viện."
  - "[x] 6. Khi người dùng chọn Video từ bộ sưu tập và bấm Thêm -> Trình Biên Tập Video (Video Editor) tải Video thật vào Player Preview, hiển thị poster thumbnail thật hoặc phát video trực tiếp khi bấm Play."
  - "[x] 7. Toàn bộ các công cụ con/cháu trong Video Editor (Tách clip, Đổi tốc độ 0.5x-5x, Âm lượng 0-200%, Xóa clip, Chỉnh màu ColorMatrix, Đổi tỷ lệ khung hình 9:16/16:9, Xuất video FFmpeg C++20) áp dụng mượt mà trên tệp thật."
  - "[x] 8. Chạy bộ kiểm thử tự động nghiệm thu trên điện thoại thật Samsung Galaxy Note 10 Lite (192.168.1.7:45893), chụp ảnh màn hình minh chứng từng bước không làm màu dối trá."
