requirements:
  - "1. Nút Chuyển Cảnh '⧎' / '⚡' Trên Timeline: Giữa mỗi 2 clip kế tiếp trên timelineClipsRow, chèn một nút chuyển cảnh bo tròn. Khi bấm vào, mở showTransitionDialog(). [HOÀN THÀNH 100%]"
  - "2. Hộp Thoại Chuyển Cảnh (Transition Dialog): 10 hiệu ứng chuẩn CapCut (Dissolve, Fade to Black, Flash White, Slide Left, Slide Right, Zoom In, Zoom Out, Light Leak, Glitch RGB, Strobe Beat) + SeekBar thời lượng 0.1s - 2.0s + Áp dụng cho tất cả. [HOÀN THÀNH 100%]"
  - "3. Nút Khung Hình Chính '◆' Cạnh Nút Play: Bổ sung btnKeyframeToggle trên playerBar hiển thị '+◆' (thêm) hoặc '-◆' (xóa nếu playhead trùng điểm keyframe). [HOÀN THÀNH 100%]"
  - "4. Dữ Liệu & Hiển Thị Keyframe: Lưu mảng KeyframePoint trên từng clip (timeMs, scale, transX, transY, rotation, opacity), vẽ các chấm đỏ '◆' trên thẻ clip ở đúng mốc thời gian. [HOÀN THÀNH 100%]"
  - "5. Thuật Toán Nội Suy Tuyến Tính (Lerp): Trong vòng lặp render video / slideshow, tự động tính toán tỷ lệ scale, tọa độ và độ mờ giữa 2 keyframe kẹp giữa. [HOÀN THÀNH 100%]"
  - "6. Pro Audio Suite: Bộ thanh trượt âm lượng 0% - 1000% Boost, các nút nhanh (Mute, 100%, 200%, 500%, 1000%), thanh trượt Fade In/Out 0.0s - 5.0s. [HOÀN THÀNH 100%]"
  - "7. Hoạt ảnh clip (Clip Animations In/Out/Combo): 10 hiệu ứng chuyên nghiệp. [HOÀN THÀNH 100%]"
  - "8. Thao tác clip: Nhân bản (Duplicate) thêm clip vào timeline, Độ mờ (Opacity) 0-100% thời gian thực. [HOÀN THÀNH 100%]"
  - "9. Cử chỉ timeline: Thu phóng dải filmstrip hai ngón tay (Pinch-to-zoom). [HOÀN THÀNH 100%]"
  - "10. Kiểm thử và xác thực thực tế 100% trên thiết bị thật Samsung Galaxy A50s (192.168.1.3:36903) và chụp ảnh minh chứng. [HOÀN THÀNH 100%]"
